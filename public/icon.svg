  <rect x="372" y="140" width="10" height="232" rx="3" fill="#f8fafc"/>
  <!-- Corner Finder Targets -->
  <path d="M100 130 V100 H130" stroke="#10b981" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M412 130 V100 H382" stroke="#10b981" stroke-width="8" stroke-linecap="round" fill="none"/>
